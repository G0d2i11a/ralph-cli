name: Test Ralph CLI
on:
  push:
    branches: [ci/juxu-ralph-cli-ordinary-20261121]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juxu-ralph-cli-ordinary
  cancel-in-progress: false

jobs:
  verify:
    name: Test Ralph CLI
    if: >-
      github.repository_id == '1174072112' &&
      github.repository == 'G0d2i11a/ralph-cli' &&
      github.ref == 'refs/heads/ci/juxu-ralph-cli-ordinary-20261121' &&
      github.actor_id == '130071715' &&
      github.triggering_actor == 'G0d2i11a' &&
      github.run_attempt == 1
    runs-on: juxu-ralph-cli-linux-amd64-v1
    timeout-minutes: 45
    steps:
      - name: Verify ordinary Linux guest
        env:
          GUEST_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GUEST_ENVIRONMENT" == self-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
          [[ "$RUNNER_NAME" =~ ^juxu-ralph-cli-[a-f0-9]{16}$ ]]

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'

      - name: Verify source and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and run the CLI tests
        shell: bash
        run: |
          set -euo pipefail
          npm test
